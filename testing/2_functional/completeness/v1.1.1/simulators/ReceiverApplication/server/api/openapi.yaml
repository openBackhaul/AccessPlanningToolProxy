  /v1/provide-acceptance-data-of-link-endpoint-for-requestId:
    description: Returns acceptance data of endpoint for given request-id
    post:
      operationId: provideAcceptanceDataOfLinkEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/body_2'
      responses:
        "200":
          description: Acceptance data for given request-id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
              example:
                request-id: 513250010-513550010-240829-1050
                air-interface:
                  air-interface-endpoint-name: 513550010B
                  configured-tx-power: 10
                  current-tx-power: 5
