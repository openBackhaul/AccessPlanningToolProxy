paths:
  /v1/receive-acceptance-data-of-link-endpoint:
    description: The request shall be received from APTP application as a callback
      of /v1/provide-acceptance-data-of-link-endpoint. The received data shall be
      stored in cache
    post:
      operationId: receiveAcceptanceDataOfLinkEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/body'
            example:
              request-id: 513250010-513550010-240829-1050
