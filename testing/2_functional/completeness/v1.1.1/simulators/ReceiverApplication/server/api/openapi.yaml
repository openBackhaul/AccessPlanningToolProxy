    inline_response_200_2:
      oneOf:
      - type: array
        description: Successfully executed
        items:
          type: object
          properties:
            request-id:
              type: string
              description: "'Identifier of the initial request (to /v1/provide-acceptance-data-of-link-endpoint)\
                \ as it has been provided in its responseBody from {$response.body#request-id}'\n"
            air-interface:
              type: object
              properties:
                air-interface-endpoint-name:
                  type: string
                  description: Identifier of the microwave link endpoint as used in
                    the Telefonica planing tools
                configured-tx-power:
                  type: integer
                  description: Configured transmit power that will be operated in
                    maximum in dBm
                current-tx-power:
                  type: integer
                  description: Currently measured transmit power in dBm
                current-rx-level:
                  type: integer
                  description: Currently measured receive level in dBm
                supported-radio-signal-id-datatype:
                  type: string
                  description: Datatype which is supported as a Radio Signal ID by
                    the device
                  enum:
                  - air-interface-2-0:RADIO_SIGNAL_ID_DATATYPE_TYPE_INTEGER
                  - air-interface-2-0:RADIO_SIGNAL_ID_DATATYPE_TYPE_STRING
                supported-radio-signal-id-length:
                  type: integer
                  description: "'If (supportedRadioSignalIdDatatype==INTEGER): Maximum\
                    \ value of the Radio Signal ID supported by the device; If (supportedRadioSignalIdDatatype==STRING):\
                    \ Maximum number of letters supported by the device.\n"
                configured-transmitted-radio-signal-id:
                  type: object
                  properties:
                    alphanumeric-radio-signal-id:
                      type: string
                    numeric-radio-signal-id:
                      type: integer
                  description: Radio signal ID that is configured to be transmitted
                configured-expected-radio-signal-id:
                  type: object
                  properties:
                    alphanumeric-radio-signal-id:
                      type: string
                    numeric-radio-signal-id:
                      type: integer
                  description: Radio signal ID configured to be expected on the signal
                    to synchronize the receiver to
                configured-atpc-is-on:
                  type: boolean
                  description: "This configuration value is true, if automatic transmit\
                    \ power control (ATPC) is configured to be switched on"
                configured-atpc-threshold-upper:
                  type: integer
                  description: Configured upper automatic transmit power control (ATPC)
                    threshold in dBm
                configured-atpc-threshold-lower:
                  type: integer
                  description: Configured lower automatic transmit power control (ATPC)
                    threshold in dBm
                configured-atpc-tx-power-min:
                  type: integer
                  description: Configured TX power value (in dBm) that must not be
                    undercut by automatic transmit power control (ATPC)
                configured-adaptive-modulation-is-on:
                  type: boolean
                  description: "This configuration value is true, if adpative modulation\
                    \ is configured to be switched on"
                configured-modulation-minimum:
                  type: object
                  properties:
                    number-of-states:
                      type: integer
                    name-at-lct:
                      type: string
                  description: Configured minimum modulation scheme
                configured-modulation-maximum:
                  type: object
                  properties:
                    number-of-states:
                      type: integer
                    name-at-lct:
                      type: string
                  description: Configured maximum modulation scheme
                current-modulation:
                  type: object
                  properties:
                    number-of-states:
                      type: integer
                    name-at-lct:
                      type: string
                  description: Currently operated modulation scheme
                configured-channel-bandwidth-min:
                  type: integer
                configured-channel-bandwidth-max:
                  type: integer
                current-cross-polarization-discrimination:
                  type: integer
                  description: Currently measured cross polarization discrimination
                    (XPD)
                configured-performance-monitoring-is-on:
                  type: boolean
                  description: "This configuration value is true, if collecting performance\
                    \ values is configured to be activated"
                configured-xpic-is-on:
                  type: boolean
                  description: "This configuration value is true, if cross polarization\
                    \ interference cancellation (XPIC) is configured to be activated"
                current-signal-to-noise-ratio:
                  type: integer
                  description: Currently measured signal to noise + interference ratio
                    (SNIR)
                current-tx-frequency:
                  type: integer
                  description: Current transmit frequency in kHz
                current-rx-frequency:
                  type: integer
                  description: Current receive frequency in kHz
            vlan-interface:
              type: object
              properties:
                configured-lan-port-role-list:
                  type: array
                  description: Provided for Ericsson devices only
                  items:
                    type: object
                    properties:
                      interface-name:
                        type: string
                      vlan-interface-kind:
                        type: string
                      serving-ethernet-container-status:
                        type: string
                configured-wan-port-role-list:
                  type: array
                  description: Provided for Ericsson devices only
                  items:
                    type: object
                    properties:
                      interface-name:
                        type: string
                      vlan-interface-kind:
                        type: string
                      serving-ethernet-container-status:
                        type: string
            inventory:
              type: object
              properties:
                radio:
                  type: object
                  properties:
                    equipment-name:
                      type: string
                      description: Name of the radio type
                    serial-number:
                      type: string
                      description: Serial number of the radio
                    part-number:
                      type: string
                      description: Part number of the radio
                modem:
                  type: object
                  properties:
                    equipment-name:
                      type: string
                      description: Name of the modem type
                    serial-number:
                      type: string
                      description: Serial number of the modem
                    part-number:
                      type: string
                      description: Part number of the modem
                device:
                  type: object
                  properties:
                    equipment-name:
                      type: string
                      description: Name of the device type
                    serial-number:
                      type: string
                      description: Serial number of the device
                    part-number:
                      type: string
                      description: Part number of the device
                installed-firmware:
                  type: array
                  description: List of installed firmware
                  items:
                    type: object
                    properties:
                      firmware-component-name:
                        type: string
                        description: Name of the firmware component
                      firmware-component-version:
                        type: string
                        description: Version of the firmware component
                      firmware-component-status:
                        type: string
                        description: Activation status of the firmware component
                configured-group-of-air-interfaces:
                  type: array
                  description: "'Configured group of resources (of type AirInterface\
                    \ or WireInterface) that are transporting fragments of the same\
                    \ Ethernet frames Starting from the AirInterface that is identified\
                    \ by UuidUnderTest determined in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
                    \ the transported EthernetContainer has to be determined by stepping\
                    \ upward the hierarchy of LTPs retrieved in RequestForProvidingAcceptanceDataCausesReadingLtpStructure\
                    \ ClientStructureUuid = LtpUnderTest.ClientLtp ClientContainerUuid\
                    \ = ClientStructure.ClientLtp At the transported EthernetContainer,\
                    \ the group of servering LTPs has to be identified and the transporting\
                    \ physical interfaces have to be determined by stepping downward\
                    \ the hierarchy of LTPs ServingStructureUuidList = ClientContainer.ServerLtp\
                    \ List(ServingPhysicUuid) = List(ServingStructure.ServerLtp) the\
                    \ link-id shall be provided for LTPs where ServingPhysic.LayerProtocolName\
                    \ == AIR_LAYER alternatively the interface-name shall be provided\
                    \ for LTPs where ServingPhysic.LayerProtocolName == WIRE_LAYER'\n"
                  items:
                    oneOf:
                    - required:
                      - link-id
                      type: object
                      properties:
                        link-id:
                          type: string
                          description: Identifier of the microwave link as used in
                            the Telefonica planing tools. To be obtained by extracting
                            the substring constituted by the 9 first characters
                      description: AirInterfaces
                    - required:
                      - interface-name
                      type: object
                      properties:
                        interface-name:
                          type: string
                          description: Interface name as it is represented at the
                            vendor's own management interface
                      description: WireInterface
                plugged-sfp-pmd-list:
                  type: array
                  description: "'First the list of LTPs from RequestForProvidingAcceptanceDataCausesReadingLtpStructure\
                    \ has to be filtered for LayerProtocolName == WireLayer for each\
                    \ of the WireInterfaceLtps the underlaying equipment has to be\
                    \ identified by RequestForProvidingAcceptanceDataCausesRetrievingSfpInformation.EquipmentUuid.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
                    \ now the list of WireInterfaceLtps has to be filtered for SFPs\
                    \ by {$RequestForProvidingAcceptanceDataCausesRetrievingSfpInformation.EquipmentInfo.response.body#core-model-1-4:actual-equipment/structure/category}\
                    \ == core-model-1-4:EQUIPMENT_CATEGORY_SMALL_FORMFACTOR_PLUGGABLE\
                    \ for the resulting list of WireInterfaceUuids the following information\
                    \ shall be listed'\n"
                  items:
                    type: object
                    properties:
                      interface-name:
                        type: string
                        description: Interface name of the WireInterface as it is
                          represented at the vendors own management interface
                      supported-pmd-list:
                        type: array
                        description: List of names of physical medium dependents (PMDs)
                          according to IEEE 802.3 as they are supported on the link
                          end point
                        items:
                          type: string
                      currently-operated-pmd:
                        type: string
                        description: Name of the physical medium dependent (PMD) according
                          to IEEE 802.3 that is currently operated on the link end
                          point
                      sfp-transceiver-part-number:
                        type: string
                        description: Identifier of the equipment part type
                      sfp-transceiver-serial-number:
                        type: string
                        description: Serial number of this equipment instance
                position-of-modem-board:
                  type: string
                  description: "'Provided for split mount devices only Identifier\
                    \ of the slot that holds the link end point according to the currently\
                    \ valid, official documentation of the equipment Starting from\
                    \ the AirInterface that is identified by UuidUnderTest determined\
                    \ in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
                    \ the underlaying equipment has to be identified by RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.EquipmentUuid.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
                    \ for each of the EquipmentUuids the category has to be retrieved\
                    \ by RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
                    \ The single EquipmentUuid with RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
                    \ == equipment-augment-1-0:EQUIPMENT_CATEGORY_MODEM shall be used\
                    \ to select the correct object from RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.HolderLabel,\
                    \ where this EquipmentUuid equals RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.HolderLabel.response.body#core-model-1-4:control-construct/equipment/contained-holder/occupying-fru.'\n"
                if-port-identifier:
                  type: string
                  description: "'Provided for split mount devices only Identifier\
                    \ of the port that holds the link end point according to the currently\
                    \ valid, official documentation of the equipment Starting from\
                    \ the AirInterface that is identified by UuidUnderTest determined\
                    \ in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
                    \ the underlaying equipment has to be identified by RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.EquipmentUuid.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
                    \ for each of the EquipmentUuids the category has to be retrieved\
                    \ by RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
                    \ The single EquipmentUuid with RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
                    \ == equipment-augment-1-0:EQUIPMENT_CATEGORY_OUTDOOR_UNIT' serves\
                    \ to select the ContainedHolder object for which RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.HolderLabel.response.body#core-model-1-4:control-construct/equipment/contained-holder/occupying-fru\
                    \ equals this EquipmentUuid.'\n"
                connector-plugging-the-outdoor-unit:
                  type: integer
                  description: "'Provided for split mount devices only Label of the\
                    \ connector, which is connecting the outdoor unit, as it is printed\
                    \ at the outside of the device Starting from the AirInterface\
                    \ that is identified by UuidUnderTest determined in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
                    \ the underlaying equipment and connector have to be identified\
                    \ by RequestForProvidingAcceptanceDataCausesDeterminingTheOduConnector.ConnectorId.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
                    \ and RequestForProvidingAcceptanceDataCausesDeterminingTheOduConnector.ConnectorId.response.body#ltp-augment-1-0:ltp-augment-pac/connector\
                    \ the following request hast to be repeated until the combination\
                    \ of EquipmentUuid and ConnectorLocalId leads actually to an instance\
                    \ of Connector'\n"
            alarms:
              type: object
              properties:
                current-alarms:
                  type: object
                  properties:
                    number-of-current-alarms:
                      type: integer
                      description: Number of currently raised alarms on the device
                    current-alarm-list:
                      type: array
                      description: List of alarms that are currently raised on the
                        device
                      items:
                        type: object
                        properties:
                          alarm-type-id:
                            type: string
                            description: This attribute and the alarm-type-qualifier
                              attribute together provides a unique identification
                              of the alarm type
