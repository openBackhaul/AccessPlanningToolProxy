    v1receiveacceptancedataoflinkendpoint_inventory:
      type: object
      properties:
        radio:
          $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_inventory_radio'
        modem:
          $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_inventory_modem'
        device:
          $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_inventory_device'
        installed-firmware:
          type: array
          description: List of installed firmware
          items:
            $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_inventory_installedfirmware'
        configured-group-of-air-interfaces:
          type: array
          description: "'Configured group of resources (of type AirInterface or WireInterface)\
            \ that are transporting fragments of the same Ethernet frames Starting\
            \ from the AirInterface that is identified by UuidUnderTest determined\
            \ in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
            \ the transported EthernetContainer has to be determined by stepping upward\
            \ the hierarchy of LTPs retrieved in RequestForProvidingAcceptanceDataCausesReadingLtpStructure\
            \ ClientStructureUuid = LtpUnderTest.ClientLtp ClientContainerUuid = ClientStructure.ClientLtp\
            \ At the transported EthernetContainer, the group of servering LTPs has\
            \ to be identified and the transporting physical interfaces have to be\
            \ determined by stepping downward the hierarchy of LTPs ServingStructureUuidList\
            \ = ClientContainer.ServerLtp List(ServingPhysicUuid) = List(ServingStructure.ServerLtp)\
            \ the link-id shall be provided for LTPs where ServingPhysic.LayerProtocolName\
            \ == AIR_LAYER alternatively the interface-name shall be provided for\
            \ LTPs where ServingPhysic.LayerProtocolName == WIRE_LAYER'\n"
          items:
            oneOf:
            - required:
              - link-id
              type: object
              properties:
                link-id:
                  type: string
                  description: Identifier of the microwave link as used in the Telefonica
                    planing tools. To be obtained by extracting the substring constituted
                    by the 9 first characters
              description: AirInterfaces
            - required:
              - interface-name
              type: object
              properties:
                interface-name:
                  type: string
                  description: Interface name as it is represented at the vendor's
                    own management interface
              description: WireInterface
        plugged-sfp-pmd-list:
          type: array
          description: "'First the list of LTPs from RequestForProvidingAcceptanceDataCausesReadingLtpStructure\
            \ has to be filtered for LayerProtocolName == WireLayer for each of the\
            \ WireInterfaceLtps the underlaying equipment has to be identified by\
            \ RequestForProvidingAcceptanceDataCausesRetrievingSfpInformation.EquipmentUuid.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
            \ now the list of WireInterfaceLtps has to be filtered for SFPs by {$RequestForProvidingAcceptanceDataCausesRetrievingSfpInformation.EquipmentInfo.response.body#core-model-1-4:actual-equipment/structure/category}\
            \ == core-model-1-4:EQUIPMENT_CATEGORY_SMALL_FORMFACTOR_PLUGGABLE for\
            \ the resulting list of WireInterfaceUuids the following information shall\
            \ be listed'\n"
          items:
            $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_inventory_pluggedsfppmdlist'
        position-of-modem-board:
          type: string
          description: "'Provided for split mount devices only Identifier of the slot\
            \ that holds the link end point according to the currently valid, official\
            \ documentation of the equipment Starting from the AirInterface that is\
            \ identified by UuidUnderTest determined in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
            \ the underlaying equipment has to be identified by RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.EquipmentUuid.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
            \ for each of the EquipmentUuids the category has to be retrieved by RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
            \ The single EquipmentUuid with RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
            \ == equipment-augment-1-0:EQUIPMENT_CATEGORY_MODEM shall be used to select\
            \ the correct object from RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.HolderLabel,\
            \ where this EquipmentUuid equals RequestForProvidingAcceptanceDataCausesDeterminingTheModemPosition.HolderLabel.response.body#core-model-1-4:control-construct/equipment/contained-holder/occupying-fru.'\n"
        if-port-identifier:
          type: string
          description: "'Provided for split mount devices only Identifier of the port\
            \ that holds the link end point according to the currently valid, official\
            \ documentation of the equipment Starting from the AirInterface that is\
            \ identified by UuidUnderTest determined in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
            \ the underlaying equipment has to be identified by RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.EquipmentUuid.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
            \ for each of the EquipmentUuids the category has to be retrieved by RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
            \ The single EquipmentUuid with RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.EquipmentCategory.response.by#core-model-1-4:actual-equipment/structure/category\
            \ == equipment-augment-1-0:EQUIPMENT_CATEGORY_OUTDOOR_UNIT' serves to\
            \ select the ContainedHolder object for which RequestForProvidingAcceptanceDataCausesDeterminingTheIfPortIdentifier.HolderLabel.response.body#core-model-1-4:control-construct/equipment/contained-holder/occupying-fru\
            \ equals this EquipmentUuid.'\n"
        connector-plugging-the-outdoor-unit:
          type: integer
          description: "'Provided for split mount devices only Label of the connector,\
            \ which is connecting the outdoor unit, as it is printed at the outside\
            \ of the device Starting from the AirInterface that is identified by UuidUnderTest\
            \ determined in RequestForProvidingAcceptanceDataCausesDeterminingAirInterfaceUuidUnderTest\
            \ the underlaying equipment and connector have to be identified by RequestForProvidingAcceptanceDataCausesDeterminingTheOduConnector.ConnectorId.response.body#ltp-augment-1-0:ltp-augment-pac/equipment\
            \ and RequestForProvidingAcceptanceDataCausesDeterminingTheOduConnector.ConnectorId.response.body#ltp-augment-1-0:ltp-augment-pac/connector\
            \ the following request hast to be repeated until the combination of EquipmentUuid\
            \ and ConnectorLocalId leads actually to an instance of Connector'\n"
