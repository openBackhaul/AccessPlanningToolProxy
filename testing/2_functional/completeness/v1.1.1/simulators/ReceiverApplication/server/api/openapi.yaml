    body:
      oneOf:
      - type: object
        properties:
          request-id:
            type: string
            description: "'Identifier of the initial request (to /v1/provide-acceptance-data-of-link-endpoint)\
              \ as it has been provided in its responseBody from {$response.body#request-id}'\n"
          air-interface:
            $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_airinterface'
          vlan-interface:
            $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_vlaninterface'
          inventory:
            $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_inventory'
          alarms:
            $ref: '#/components/schemas/v1receiveacceptancedataoflinkendpoint_alarms'
        description: Successfully executed
      - required:
        - code
        - message
        type: object
        properties:
          code:
            maximum: 470
            minimum: 470
            type: integer
            format: int32
          message:
            type: string
            enum:
            - The requested ressource does not exist within the referenced device
        description: The requested ressource does not exist within the referenced
          device
      - required:
        - code
        - message
        type: object
        properties:
          code:
            maximum: 502
            minimum: 502
            type: integer
            format: int32
          message:
            type: string
            enum:
            - Bad Gateway. The upstream server (MicrowveDeviceInventory) is unavailable
        description: Bad Gateway. Mwdi is unavailable
      - required:
        - code
        - message
        type: object
        properties:
          code:
            maximum: 530
            minimum: 530
            type: integer
            format: int32
          message:
            type: string
            enum:
            - "Data invalid. Response data not available, incomplete or corrupted"
        description: "Data invalid. Response data not available, incomplete or corrupted"
